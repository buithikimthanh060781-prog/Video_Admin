<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https://laoxrsdemwvwcpqjqecq.supabase.co; connect-src 'self' https://laoxrsdemwvwcpqjqecq.supabase.co wss://laoxrsdemwvwcpqjqecq.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Forgot Password - Video Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="forgot-password">
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">Video Admin</div>
      <h1 class="auth-title">Quên mật khẩu</h1>
      <p class="auth-subtitle">Nhập email, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
      <form id="auth-form" class="auth-form" novalidate>
        <div class="form-message" role="alert" hidden></div>
        <fieldset>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
            <small class="field-error" data-error-for="email"></small>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Gửi link đặt lại mật khẩu</button>
        </fieldset>
      </form>
      <p class="auth-footer"><a href="login.html">← Quay lại đăng nhập</a></p>
    </div>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
