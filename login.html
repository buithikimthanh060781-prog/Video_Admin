<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https://laoxrsdemwvwcpqjqecq.supabase.co; connect-src 'self' https://laoxrsdemwvwcpqjqecq.supabase.co wss://laoxrsdemwvwcpqjqecq.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Login - Video Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="login">
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">Video Admin</div>
      <h1 class="auth-title">Đăng nhập</h1>
      <form id="auth-form" class="auth-form" novalidate>
        <div class="form-message" role="alert" hidden></div>
        <fieldset>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
            <small class="field-error" data-error-for="email"></small>
          </div>
          <div class="form-group">
            <div class="form-label-row">
              <label for="password">Password</label>
              <a href="forgot-password.html" class="auth-link-small">Quên mật khẩu?</a>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password">
            <small class="field-error" data-error-for="password"></small>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
        </fieldset>
      </form>
      <p class="auth-footer">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </div>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
