<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https://laoxrsdemwvwcpqjqecq.supabase.co; connect-src 'self' https://laoxrsdemwvwcpqjqecq.supabase.co wss://laoxrsdemwvwcpqjqecq.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/images/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/images/brand/logo-icon-192.png">
  <title>Tài khoản - Học Vèo</title>
  <link rel="stylesheet" href="css/style.css?v=202610180851">
  <link rel="stylesheet" href="css/responsive.css?v=202610180851">
  <link rel="stylesheet" href="css/learning.css?v=202610180851">
</head>
<body class="auth-pending">
  <div class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="header" class="header"></header>
      <main id="content" class="content">
        <div class="card account-card">
          <h2 class="card-title">Thông tin tài khoản</h2>

          <div class="account-avatar">
            <span id="account-avatar" class="avatar avatar-xl"></span>
            <div class="account-avatar-actions">
              <div class="account-avatar-buttons">
                <label class="btn btn-secondary btn-sm" for="avatar-input">Đổi ảnh đại diện</label>
                <input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" class="visually-hidden">
                <button id="avatar-remove" type="button" class="btn btn-secondary btn-sm text-danger" hidden>Xóa ảnh đại diện</button>
              </div>
              <small class="form-hint">JPG, PNG, WEBP · tối đa 2 MB</small>
              <small id="avatar-error" class="field-error"></small>
            </div>
          </div>

          <dl class="info-list">
            <dt>Tên đăng nhập</dt><dd id="account-username"></dd>
            <dt>Email</dt><dd id="account-email"></dd>
            <dt>Số điện thoại</dt><dd id="account-phone"></dd>
            <dt>Vai trò</dt><dd id="account-role"></dd>
            <dt>Trạng thái</dt><dd id="account-status"></dd>
            <dt>Ngày tạo</dt><dd id="account-created-at"></dd>
          </dl>

          <form id="phone-form" class="phone-form" novalidate>
            <h3 class="section-subtitle">Cập nhật số điện thoại</h3>
            <div class="form-group">
              <label for="phone-input">Số điện thoại</label>
              <input id="phone-input" name="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="vd: 0912 345 678">
              <small class="form-hint">Quản trị viên liên hệ qua số này để kích hoạt khóa học. Để trống nếu muốn xóa số.</small>
              <small class="field-error" id="phone-error"></small>
            </div>
            <button type="submit" id="phone-save" class="btn btn-primary btn-sm">Lưu số điện thoại</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="js/account.js?v=202610180851"></script>
</body>
</html>
