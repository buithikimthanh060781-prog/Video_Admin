<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https://laoxrsdemwvwcpqjqecq.supabase.co; connect-src 'self' https://laoxrsdemwvwcpqjqecq.supabase.co wss://laoxrsdemwvwcpqjqecq.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Đặt lại mật khẩu - Học Vèo</title>
  <link rel="stylesheet" href="css/style.css?v=202610171951">
  <link rel="stylesheet" href="css/auth.css?v=202610171951">
  <link rel="stylesheet" href="css/responsive.css?v=202610171951">
</head>
<body data-auth-page="reset-password">
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">Học Vèo</div>
      <h1 class="auth-title">Đặt lại mật khẩu</h1>
      <form id="auth-form" class="auth-form" novalidate>
        <div class="form-message" role="alert" hidden></div>
        <fieldset>
          <div class="form-group">
            <label for="password">Mật khẩu mới</label>
            <input id="password" name="password" type="password" autocomplete="new-password">
            <small class="field-error" data-error-for="password"></small>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
            <small class="field-error" data-error-for="confirmPassword"></small>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Cập nhật mật khẩu</button>
        </fieldset>
      </form>
      <p class="auth-footer"><a href="forgot-password.html">Yêu cầu đường dẫn mới</a></p>
    </div>
  </main>
  <script type="module" src="js/auth.js?v=202610171951"></script>
</body>
</html>
