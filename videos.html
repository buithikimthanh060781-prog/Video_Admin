<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https://laoxrsdemwvwcpqjqecq.supabase.co; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://laoxrsdemwvwcpqjqecq.supabase.co wss://laoxrsdemwvwcpqjqecq.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Quản lý video - Học Vèo</title>
  <link rel="stylesheet" href="css/style.css?v=202610171951">
  <link rel="stylesheet" href="css/responsive.css?v=202610171951">
</head>
<body class="auth-pending">
  <div class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="header" class="header"></header>
      <main id="content" class="content">
        <section class="card">
          <div class="toolbar">
            <div class="toolbar-filters">
              <input type="search" id="search-input" placeholder="Tìm theo tiêu đề..." aria-label="Tìm theo tiêu đề">
              <select id="category-filter" aria-label="Lọc theo danh mục">
                <option value="">Tất cả danh mục</option>
              </select>
              <select id="status-filter" aria-label="Lọc theo trạng thái">
                <option value="">Tất cả trạng thái</option>
                <option value="PUBLISHED">Công khai</option>
                <option value="DRAFT">Bản nháp</option>
                <option value="HIDDEN">Ẩn</option>
              </select>
            </div>
            <a href="video-edit.html" class="btn btn-primary">+ Thêm video</a>
          </div>

          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Mã</th>
                  <th>Ảnh bìa</th>
                  <th>Tiêu đề</th>
                  <th>Danh mục</th>
                  <th class="text-right">Lượt xem</th>
                  <th>Trạng thái</th>
                  <th>Ngày tạo</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="videos-body"></tbody>
            </table>
          </div>

          <div id="pagination"></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="js/videos.js?v=202610171951"></script>
</body>
</html>
